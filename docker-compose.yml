version: '3.8'

services:
  backend:
    build:
      context: ./Backend
    ports:
      - "8000:8000"  # Map Uvicorn server port
    volumes:
      - ./Backend:/app  # Mount backend source code
    environment:
      - PYTHONUNBUFFERED=1  # Ensure Python output is logged in real-time

  frontend:
    build:
      context: ./Frontend/Sveltekit
    ports:
      - "5173:5173"  # Map SvelteKit development server port
    volumes:
      - ./Frontend/Sveltekit:/app  # Mount frontend source code
    command: ["npm", "run", "dev", "--", "--host"]  # Run development server
