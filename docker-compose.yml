version: '3.8'
services:
  backend:
    build:
      context: ./Backend
    ports:
      - "8000:8000"
    volumes:
      - ./Backend:/app
    environment:
      - PYTHONUNBUFFERED=1
  frontend:
    build:
      context: ./Frontend/Sveltekit
    ports:
      - "5173:5173"
    volumes:
      - ./Frontend/Sveltekit:/app
    command: ["npm", "run", "dev", "--", "--host"]
