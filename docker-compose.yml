version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=your_openai_api_key
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:v1.3.0
    ports:
      - "6333:6333"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
